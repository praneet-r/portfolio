<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praneet R — Full-Stack Software Developer</title>
    <meta
      name="description"
      content="Praneet R is a Full-Stack Software Developer in Bengaluru (open to remote), building web applications with Python, React, SQL, REST APIs, and practical LLM integrations."
    />
    <meta property="og:title" content="Praneet R — Full-Stack Software Developer" />
    <meta
      property="og:description"
      content="Full-Stack Software Developer building web applications with Python, React, SQL, and practical LLM APIs. B.S. in Data Science and Applications, IIT Madras."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Clean engineering typography: IBM Plex Sans + IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Light mode by default; restore dark mode only if explicitly chosen -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('praneet-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0D0F12');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
